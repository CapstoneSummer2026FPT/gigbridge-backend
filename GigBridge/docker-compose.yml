version: '3.8'

services:
  web-api:
    image: ${WEB_API_IMAGE:-ghcr.io/capstonesummer2026fpt/gigbridge-api:latest}
    container_name: gigbridge-api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

      # Database
      - ConnectionStrings__DefaultConnection=${DATABASE_URL}
      - DatabasePool__MaxPoolSize=${DATABASE_POOL_MAX_SIZE:-5}
      - DatabasePool__MinPoolSize=0
      - DatabasePool__ConnectionIdleLifetimeSeconds=${DATABASE_POOL_IDLE_SECONDS:-60}
      - DatabasePool__ConnectionPruningIntervalSeconds=10
      - DatabasePool__ApplicationName=${DATABASE_POOL_APPLICATION_NAME:-GigBridge-Production}

      # Run these on only one production instance. Development defaults to disabled.
      - BackgroundWorkers__Enabled=${BACKGROUND_WORKERS_ENABLED:-true}

      # Redis (External Connection)
      - Redis__ConnectionString=${REDIS_CONNECTION_STRING}

      # JWT
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__AccessTokenMinutes=${JWT_ACCESS_TOKEN_MINUTES:-60}
      - Jwt__RefreshTokenMinutes=${JWT_REFRESH_TOKEN_MINUTES:-10080}

      # Multi-device refresh-token sessions. Production must set this explicitly.
      - AuthSessions__Enabled=${AUTH_SESSIONS_ENABLED:?AUTH_SESSIONS_ENABLED must be set to true}
      - AuthSessions__MaxActiveSessionsPerUser=${AUTH_SESSIONS_MAX_ACTIVE_PER_USER:-5}

      # PayOS
      - PayOS__ClientId=${PAYOS_CLIENT_ID}
      - PayOS__ApiKey=${PAYOS_API_KEY}
      - PayOS__ChecksumKey=${PAYOS_CHECKSUM_KEY}
      - PayOS__ReturnUrl=${PAYOS_RETURN_URL}
      - PayOS__CancelUrl=${PAYOS_CANCEL_URL}

      # PayOS Payout
      - PayOSPayout__ClientId=${PAYOS_PAYOUT_CLIENT_ID}
      - PayOSPayout__ApiKey=${PAYOS_PAYOUT_API_KEY}
      - PayOSPayout__ChecksumKey=${PAYOS_PAYOUT_CHECKSUM_KEY}

      # Wallet Withdrawals
      - WalletWithdrawals__Enabled=${WALLET_WITHDRAWALS_ENABLED}

      # Frontend Base URL
      - FrontendBaseUrl=${FRONTEND_BASE_URL}

      # Google Authentication (Login)
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET}

      # Cloudinary
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}

      # Google Meet
      - GoogleMeet__ClientId=${GOOGLE_MEET_CLIENT_ID}
      - GoogleMeet__ClientSecret=${GOOGLE_MEET_CLIENT_SECRET}
      - GoogleMeet__BackendCallbackUri=${GOOGLE_MEET_BACKEND_CALLBACK_URI}
      - GoogleMeet__FrontendCallbackUri=${GOOGLE_MEET_FRONTEND_CALLBACK_URI}

      # Resend
      - Resend__ApiToken=${RESEND_API_TOKEN}
      - Resend__From=${RESEND_FROM}
      - Resend__FromName=${RESEND_FROM_NAME}

      # AI Service
      - AiService__BaseUrl=${AI_SERVICE_BASE_URL}
      - AiService__ApiKey=${AI_SERVICE_API_KEY}

      # Sentry capture and read-only admin issue feed
      - Sentry__Dsn=${SENTRY_BACKEND_DSN:-}
      - Sentry__Environment=${SENTRY_ENVIRONMENT:-production}
      - Sentry__Release=${SENTRY_RELEASE:-}
      - Sentry__TracesSampleRate=${SENTRY_TRACES_SAMPLE_RATE:-0}
      - SentryMonitoring__Organization=${SENTRY_ORGANIZATION:-}
      - SentryMonitoring__AuthToken=${SENTRY_MONITORING_AUTH_TOKEN:-}
      - SentryMonitoring__Environment=${SENTRY_ENVIRONMENT:-production}
      - SentryMonitoring__ProjectIds__0=${SENTRY_FRONTEND_PROJECT_ID:-}
      - SentryMonitoring__ProjectIds__1=${SENTRY_BACKEND_PROJECT_ID:-}
      - SentryMonitoring__ProjectIds__2=${SENTRY_AI_PROJECT_ID:-}

    ports:
      - "127.0.0.1:8080:8080" # Exposed locally; Nginx routes public traffic

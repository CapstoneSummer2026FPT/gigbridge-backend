map $http_origin $gigbridge_cors_origin {
    default "";
    "https://gigbridge.id.vn" $http_origin;
    "https://www.gigbridge.id.vn" $http_origin;
}

map $http_upgrade $gigbridge_connection_upgrade {
    default upgrade;
    "" close;
}

# Ordinary API requests stay evenly distributed across both application nodes.
upstream gigbridge_api_round_robin {
    server 127.0.0.1:8080;
    server 172.31.19.1:8080;
}

# A SignalR connection ID is owned by the node that negotiated it. Keep every
# request from the same client on that node while Redis distributes hub events
# between nodes.
upstream gigbridge_signalr_affinity {
    ip_hash;
    server 127.0.0.1:8080;
    server 172.31.19.1:8080;
}

# Never write hub query strings to access logs because browser SignalR clients
# carry their bearer token in the access_token query parameter.
log_format gigbridge_signalr_no_args
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    'request_id=$request_id upstream=$upstream_addr '
    'upstream_status=$upstream_status elapsed=$request_time';

server {
    server_name api.gigbridge.id.vn;

    # Nginx receives up to 100 MiB of file data plus multipart overhead.
    # Application validators remain authoritative for per-file and batch limits.
    client_max_body_size 105m;
    client_body_timeout 300s;


    error_page 413 = @upload_too_large;
    error_page 503 = @auth_maintenance;

    # The deploy workflow creates this flag only while the auth schema and both
    # API nodes are being upgraded. All non-authenticated API traffic stays online.
    location ^~ /api/auth/ {
        if (-f /var/run/gigbridge-auth-maintenance) {
            return 503;
        }

        proxy_pass http://gigbridge_api_round_robin;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://gigbridge_api_round_robin;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        proxy_pass http://gigbridge_signalr_affinity;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gigbridge_connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Preserve long-running SignalR/WebSocket connections.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Don't buffer SSE/long-polling fallback transports.
        proxy_buffering off;

        access_log /var/log/nginx/gigbridge-signalr.access.log gigbridge_signalr_no_args;
    }

    # Nginx can reject an oversized request before ASP.NET Core attaches its
    # JSON envelope and CORS headers. Return a browser-readable 413 response.
    location @upload_too_large {
        internal;
        default_type application/json;
        add_header Access-Control-Allow-Origin $gigbridge_cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary "Origin" always;
        return 413 '{"success":false,"statusCode":413,"message":"Upload request exceeds the allowed size."}';
    }

    location @auth_maintenance {
        internal;
        default_type application/json;
        add_header Access-Control-Allow-Origin $gigbridge_cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary "Origin" always;
        add_header Retry-After "180" always;
        return 503 '{"success":false,"statusCode":503,"message":"Authentication is temporarily unavailable during a scheduled deployment. Please retry shortly."}';
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.gigbridge.id.vn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.gigbridge.id.vn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.gigbridge.id.vn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.gigbridge.id.vn;
    return 404; # managed by Certbot
}

map $http_origin $gigbridge_cors_origin {
    default "";
    "https://gigbridge.id.vn" $http_origin;
    "https://www.gigbridge.id.vn" $http_origin;
}

server {
    listen 80;
    server_name api.gigbridge.id.vn; # Replace with your actual domain

    # The application accepts up to 100 MiB of uploaded file data plus
    # multipart framing. Keep the proxy ceiling close to that boundary so
    # application-level validation remains authoritative.
    client_max_body_size 105m;
    client_body_timeout 300s;

    error_page 413 = @upload_too_large;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nginx rejects an oversized request before ASP.NET Core can attach its
    # normal JSON envelope and CORS headers. Return the same public envelope
    # shape here so browser clients can display an actionable 413 response.
    location @upload_too_large {
        internal;
        default_type application/json;
        add_header Access-Control-Allow-Origin $gigbridge_cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary "Origin" always;
        return 413 '{"success":false,"statusCode":413,"message":"Upload request exceeds the allowed size."}';
    }
}

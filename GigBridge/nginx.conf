map $http_origin $gigbridge_cors_origin {
    default "";
    "https://gigbridge.id.vn" $http_origin;
    "https://www.gigbridge.id.vn" $http_origin;
}

server {
    server_name api.gigbridge.id.vn;

    # Nginx receives up to 100 MiB of file data plus multipart overhead.
    # Application validators remain authoritative for per-file and batch limits.
    client_max_body_size 105m;
    client_body_timeout 300s;


    error_page 413 = @upload_too_large;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Preserve long-running SignalR/WebSocket connections.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Don't buffer SSE/long-polling fallback transports.
        proxy_buffering off;
    }

    # Nginx can reject an oversized request before ASP.NET Core attaches its
    # JSON envelope and CORS headers. Return a browser-readable 413 response.
    location @upload_too_large {
        internal;
        default_type application/json;
        add_header Access-Control-Allow-Origin $gigbridge_cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary "Origin" always;
        return 413 '{"success":false,"statusCode":413,"message":"Upload request exceeds the allowed size."}';
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.gigbridge.id.vn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.gigbridge.id.vn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.gigbridge.id.vn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.gigbridge.id.vn;
    return 404; # managed by Certbot
}

name: Build & Deploy .NET API

on:
  push:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase Owner Name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: "${{ github.repository_owner }}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Web API
        uses: docker/build-push-action@v5
        with:
          context: ./GigBridge
          file: ./GigBridge/Project_API/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/gigbridge-api:latest
            ghcr.io/${{ env.OWNER_LC }}/gigbridge-api:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            cd ~/app
            echo "${{ secrets.DEPLOY_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull web-api
            docker compose run --rm --no-deps --entrypoint /bin/sh web-api \
              -c 'exec /app/efbundle --connection "$ConnectionStrings__DefaultConnection"'
            docker compose up -d web-api
            docker image prune -f
